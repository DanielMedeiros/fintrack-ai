name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

  build:
    name: Monorepo Build
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build applications and packages (Turborepo)
        run: pnpm build

  infra-smoke-test:
    name: Docker Infrastructure Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment variables
        run: cp .env.example .env

      - name: Start Docker Compose services
        run: docker compose up -d

      - name: Wait for services to become healthy
        timeout-minutes: 2
        run: |
          echo "Waiting for PostgreSQL and Redis healthchecks..."
          for i in {1..30}; do
            STATUS=$(docker compose ps --format json | grep -c '"Health":"healthy"' || true)
            if [ "$STATUS" -ge 2 ]; then
              echo "PostgreSQL and Redis are healthy!"
              docker compose ps
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "Services failed to become healthy in time:"
          docker compose ps
          docker compose logs
          exit 1

      - name: Teardown infrastructure
        if: always()
        run: docker compose down -v

